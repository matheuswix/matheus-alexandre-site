<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Página não encontrada — Matheus Alexandre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        padding: 12px;
        display: flex;
        background: #eaeae7;
        font-family: 'Geist', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #0e0e0e;
      }
      .panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        text-align: center;
        background: #fff;
        border: 1px solid #e6e6e6;
        border-radius: 30px;
        padding: 40px 24px;
      }
      .code {
        font-family: 'Geist Mono', monospace;
        font-size: 11.5px;
        letter-spacing: 3px;
        color: #6d6d6d;
      }
      h1 {
        margin: 0;
        font-size: clamp(27px, 4.6vw, 44px);
        font-weight: 600;
        line-height: 1.12;
        letter-spacing: -1.2px;
        max-width: 22ch;
      }
      h1 .muted {
        color: #8e8e8e;
      }
      .home {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 13px 22px;
        border-radius: 999px;
        background: #0e0e0e;
        color: #fff;
        font-size: 14.5px;
        font-weight: 500;
        text-decoration: none;
        transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.25, 1);
      }
      .home:hover {
        transform: translateY(-2px);
      }
      .home:focus-visible {
        outline: 2px solid #0e0e0e;
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        .home {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="code">ERROR 404</div>
      <h1 id="title">
        Esta página não existe.<br /><span class="muted">O resto do site existe.</span>
      </h1>
      <a class="home" id="home" href="/">Ir para a home <span aria-hidden="true">&#8599;</span></a>
    </main>
    <script>
      // Portuguese is the default; switch to English for visitors already on
      // the English page or browsing in another language.
      (function () {
        var saved;
        try {
          saved = localStorage.getItem('lang');
        } catch (e) {}
        var lang =
          saved === 'pt' || saved === 'en'
            ? saved
            : (navigator.language || '').toLowerCase().indexOf('pt') === 0
              ? 'pt'
              : 'en';
        if (lang !== 'en') return;
        document.documentElement.lang = 'en';
        document.title = 'Page not found — Matheus Alexandre';
        document.getElementById('title').innerHTML =
          'This page doesn’t exist.<br><span class="muted">The rest of the site does.</span>';
        document.getElementById('home').setAttribute('href', '/en/');
        document.getElementById('home').innerHTML =
          'Go to the homepage <span aria-hidden="true">&#8599;</span>';
      })();
    </script>
  </body>
</html>
